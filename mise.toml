# Rust itself is pinned in rust-toolchain.toml so plain rustup users get the same toolchain.
[tools]
node = "26"
"github:rust-cross/cargo-xwin" = "0.23.1"

[tasks.fmt]
description = "Format everything"
run = "cargo fmt --all"

[tasks.core]
description = "Format check, lint and test the platform-independent core"
run = [
  "cargo fmt --all --check",
  "cargo clippy -p crossz-core --all-targets -- -D warnings",
  "cargo test -p crossz-core",
]

[tasks.win]
description = "Lint and test the Windows crates (on Windows; core tests run in `core`)"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace --exclude crossz-core",
]

[tasks.mac]
description = "Lint and test the macOS crates (on macOS; core tests run in `core`)"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace --exclude crossz-core",
]

[tasks.check-win]
description = "Cross-check the Win32 overlay from macOS/Linux (the app needs llvm-rc; CI builds it on Windows)"
run = "cargo xwin clippy -p crossz-overlay-win --all-targets --target x86_64-pc-windows-msvc -- -D warnings"

[tasks.check]
description = "The local check loop: format, lint and test everything this machine can build"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "mise run check-win",
]

[tasks.golden-check]
description = "Compare the settings screenshots with the goldens (Linux only; a no-op elsewhere)"
run = "cargo test --locked -p crossz --test golden"

[tasks.goldens]
description = "Have CI re-render the screenshot goldens for the current branch and download them; look at the images, then commit"
run = "scripts/update-goldens.sh"

[tasks.ci]
description = "What CI checks on Linux, plus the Windows cross-check (`check` covers the whole workspace)"
depends = ["core", "check-win"]

[tasks.run]
description = "Run crossz"
run = "cargo run -p crossz"
