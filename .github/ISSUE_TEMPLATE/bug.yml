name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and display mode
      placeholder: CS2, borderless windowed
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Screen resolution, scale mode and Windows display scaling
      placeholder: 2560x1440, stretched 1280x960, 100%
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and monitor setup
      placeholder: Windows 11 24H2, two monitors
  - type: textarea
    id: config
    attributes:
      label: config.toml
      description: From %APPDATA%\crossz\config.toml
      render: toml
