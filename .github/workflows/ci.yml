name: ci

# Pull requests only: lint and test in debug mode, nothing built for release and no
# artifacts. Releases are built by release.yml when started by hand.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      update-goldens:
        description: Re-render the screenshot goldens and attach them as the `golden` artifact (mise run goldens)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info only slows a CI build down; nobody debugs these binaries.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # CI only runs cargo through mise tasks; node and cargo-xwin are for local use.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  core:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run core

  # Screenshots are rendered on Linux only: text anti-aliasing differs between machines, so
  # one canonical renderer (wgpu on Mesa's lavapipe software Vulkan) is what the goldens in
  # crates/app/tests/golden are compared with.
  goldens:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      CROSSZ_UPDATE_GOLDENS: ${{ inputs.update-goldens && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xkb-dev libfontconfig-dev libfreetype-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev mesa-vulkan-drivers libvulkan1 fonts-dejavu-core
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run golden-check
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-actual
          path: crates/app/tests/golden/*.actual.png
      - if: inputs.update-goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden
          path: crates/app/tests/golden/*.png

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run win

  macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run mac

  # The only required check: jobs skipped by the path filter count as passing.
  ci-ok:
    if: always()
    needs: [changes, core, goldens, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
