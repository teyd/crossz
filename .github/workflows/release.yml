name: release

# Started by hand from main: the Run workflow button, or
#   gh workflow run release -f version=0.2.0
# The version must already be in Cargo.toml (bump it in a PR first). Pushing a tag
# starts nothing: the tag and the GitHub release are created last, on the commit that
# was built, once everything else succeeded.
#
# Like Hex's release, building and publishing are separate jobs: `build` runs
# repository code but can't write anything; `publish` can write releases but never
# checks out or runs repository code, it only handles the built files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0. Must match Cargo.toml.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Run releases from main, not $GITHUB_REF"; exit 1; }
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$VERSION" = "$crate" || { echo "Cargo.toml says $crate, not $VERSION"; exit 1; }
          # Fails unless the API answers a real 404, so an outage can't pass as "absent".
          must_not_exist() {
            if out=$(gh api "repos/$GITHUB_REPOSITORY/$1" 2>&1); then
              echo "$2"; exit 1
            fi
            grep -q "HTTP 404" <<<"$out" || { echo "couldn't check $1: $out"; exit 1; }
          }
          must_not_exist "releases/tags/v$VERSION" "v$VERSION is already released"
          # A release on an existing tag keeps that tag's commit and ignores --target,
          # so the build would be attached to a commit it wasn't built from.
          must_not_exist "git/ref/tags/v$VERSION" "tag v$VERSION already exists"
      - run: cargo build --release --locked -p crossz
      # The in-app updater reads latest.json from the latest release and checks the
      # exe's size and SHA-256 before installing it.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/crossz.exe dist/crossz.exe
          Compress-Archive -Path dist/crossz.exe, README.md, LICENSE -DestinationPath "dist/crossz-v$env:VERSION-windows-x64.zip"
          $exe = Get-Item dist/crossz.exe
          $manifest = [ordered]@{
            version = $env:VERSION
            notes_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION"
            targets = @{
              "windows-x64" = [ordered]@{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/crossz.exe"
                sha256 = (Get-FileHash dist/crossz.exe -Algorithm SHA256).Hash.ToLower()
                size = $exe.Length
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM dist/latest.json
          Get-Content dist/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/crossz.exe
            dist/crossz-v${{ inputs.version }}-windows-x64.zip
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "crossz $VERSION" \
            --generate-notes
