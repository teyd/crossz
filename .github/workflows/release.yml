name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release --locked -p crossz
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/crossz.exe, README.md, LICENSE -DestinationPath crossz-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/crossz.exe
            crossz-${{ github.ref_name }}-windows-x64.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} crossz-${{ github.ref_name }}-windows-x64.zip --generate-notes --verify-tag
