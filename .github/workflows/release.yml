name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != v$version"; exit 1; }
      - run: cargo build --release --locked -p crossz
      # The in-app updater reads latest.json from the latest release and checks the
      # exe's size and SHA-256 before installing it.
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item target/release/crossz.exe crossz.exe
          Compress-Archive -Path crossz.exe, README.md, LICENSE -DestinationPath "crossz-$tag-windows-x64.zip"
          $exe = Get-Item crossz.exe
          $manifest = [ordered]@{
            version = $tag.TrimStart('v')
            notes_url = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            targets = @{
              "windows-x64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/crossz.exe"
                sha256 = (Get-FileHash crossz.exe -Algorithm SHA256).Hash.ToLower()
                size = $exe.Length
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM latest.json
          Get-Content latest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            crossz.exe
            crossz-${{ github.ref_name }}-windows-x64.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} crossz.exe crossz-${{ github.ref_name }}-windows-x64.zip latest.json --generate-notes --verify-tag
