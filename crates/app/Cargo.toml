[package]
name = "crossz"
description = "Crosshair overlay for borderless games"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-channel = "2"
crossz-core.workspace = true
crossz-overlay-win.workspace = true
crossz-overlay-mac.workspace = true
dirs = "7"
gpui-kit = "0.9"
image = { version = "0.25", default-features = false }
notify = "8"
serde = { workspace = true, features = ["derive"] }
sha2 = "0.11"
tray-icon = "0.26"
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"
