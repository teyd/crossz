[workspace]
resolver = "3"
members = ["crates/core", "crates/overlay-win", "crates/overlay-mac", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teyd/crossz"
rust-version = "1.90"

[workspace.dependencies]
crossz-core = { path = "crates/core" }
crossz-overlay-win = { path = "crates/overlay-win" }
crossz-overlay-mac = { path = "crates/overlay-mac" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
toml = "1"

# Errors, not warnings, so they hold even outside `-D warnings`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Every `unsafe` block says why it's sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
